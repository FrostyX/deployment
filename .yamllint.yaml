---
# Helm templates are not plain YAML ({{ }}); lint values/config/docs only.
extends: default

ignore: |
  openshift/helm/templates/
  .git/

rules:
  line-length:
    max: 160
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on", "off", "yes", "no"]
    check-keys: false
