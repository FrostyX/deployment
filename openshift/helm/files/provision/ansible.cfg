# Used when ansible-playbook is run with this directory as cwd (resalloc-aws-new).
[defaults]
host_key_checking = False
timeout = 60
remote_user = fedora
private_key_file = /resalloc-home/.ssh/id_rsa
local_tmp = /tmp/.ansible
forks = 5

[ssh_connection]
ssh_args = -o PasswordAuthentication=no -o ControlMaster=auto -o ControlPersist=60s
control_path_dir = /tmp/.ansible
